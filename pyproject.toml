[project]
name = "rna-vel-pred"
version = "0.1.0"
description = "Add your description here"
readme = "README.rst"
license = { file = "LICENSE" }
authors = [
    {name = 'Taos Transue', email = 'taos.transue@utah.edu'},
    {name = 'Payton J. Thomas', email = 'p5thomas@ucsd.edu'},
]
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.1",
    "h5py==3.8.0",
    "hydra-core>=1.3.2",
    "hydra-orm>=0.1.0",
    "jupyterlab>=4.3.4",
    "lightning>=2.5.0.post0",
    "numpy<2",
    "optuna-dashboard>=0.18.0",
    "optuna-integration>=4.2.1",
    "optuna>=4.2.1",
    "pyarrow>=19.0.1",
    "pytest>=8.3.4",
    "scanpy==1.9.8",
    "scipy==1.13.1",
    "scvelo==0.3.2",
    "seaborn>=0.13.2",
    "tables==3.8.0",
    "tensorboard>=2.18.0",
    "torch-geometric>=2.6.1",
    "torch>=2.5.1",
    "marimo[recommended]>=0.12.10",
    "polars>=1.27.1",
    "altair[all]>=5.5.0",
    "pyg-lib>=0.4.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torch-cluster>=1.6.3",
    "torch-spline-conv>=1.2.2",
]

[project.scripts]
rna-vel-pred = "rna_vel_pred:main"

[tool.uv.sources]
hydra-orm = [
    { git = "https://github.com/reepoi/hydra-orm", tag = "v0.1.3" },
]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
pyg_lib = [
  { index = "pytorch-geometric-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-geometric-cu124", marker = "sys_platform == 'linux'" },
]
torch_cluster = [
  { index = "pytorch-geometric-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-geometric-cu124", marker = "sys_platform == 'linux'" },
]
torch_scatter = [
  { index = "pytorch-geometric-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-geometric-cu124", marker = "sys_platform == 'linux'" },
]
torch_sparse = [
  { index = "pytorch-geometric-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-geometric-cu124", marker = "sys_platform == 'linux'" },
]
torch_spline_conv = [
  { index = "pytorch-geometric-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-geometric-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-geometric-cpu"
url = "https://data.pyg.org/whl/torch-2.4.0+cpu.html"
explicit = true
format = "flat"

[[tool.uv.index]]
name = "pytorch-geometric-cu124"
url = "https://data.pyg.org/whl/torch-2.4.0+cu124.html"
explicit = true
format = "flat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
